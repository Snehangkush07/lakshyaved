<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="lakshyavedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a56db" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#13ec6d" />
    </linearGradient>

    <!-- Fold shadow accent on the arrow curve -->
    <linearGradient id="arrowFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="20" y="20" width="160" height="160" rx="44" fill="url(#lakshyavedGrad)" />

  <!-- Inner White Background Canvas Cutout -->
  <path d="
    M 54,42 
    H 130 
    C 142,42 152,50 154,62 
    L 154,138 
    C 154,148 146,156 136,156 
    H 54 
    C 44,156 36,148 36,138 
    V 60 
    C 36,50 44,42 54,42 Z
  " fill="#ffffff" />

  <!-- Bar 1 (Shortest - Left) -->
  <rect x="52" y="108" width="22" height="42" rx="4" fill="url(#lakshyavedGrad)" />

  <!-- Bar 2 (Medium - Middle) -->
  <rect x="82" y="88" width="22" height="62" rx="4" fill="url(#lakshyavedGrad)" />

  <!-- Bar 3 & Upward Arrow (Right) -->
  <!-- Stem rising from baseline -->
  <rect x="112" y="68" width="22" height="82" rx="4" fill="url(#lakshyavedGrad)" />

  <!-- Upward Arrowhead Breaking Out of Top Right -->
  <path d="
    M 104,78 
    L 156,26 
    C 158,24 162,24 164,26 
    L 174,36 
    C 176,38 176,42 174,44 
    L 122,96 
    Z
  " fill="url(#lakshyavedGrad)" />

  <!-- Arrow Tip Triangle -->
  <path d="
    M 130,22 
    L 178,22 
    C 182,22 184,24 184,28 
    L 184,76 
    L 156,48 
    Z
  " fill="url(#lakshyavedGrad)" />

  <!-- Arrow fold shadow accent for 3D realism -->
  <path d="
    M 112,68 
    L 132,48 
    L 142,58 
    L 122,78 
    Z
  " fill="url(#arrowFoldGrad)" />
</svg>
